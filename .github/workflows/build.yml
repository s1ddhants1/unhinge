name: Build APKs

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore:
      - "README.md"
      - "assets/**"
      - ".github/**/*.md"
      - ".github/FUNDING.yml"
      - ".github/ISSUE_TEMPLATE/**"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_release:
    name: Build Release APK
    if: github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_KEY }}
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew --console=plain assembleRelease --warning-mode summary
        env:
          BUILD_COMMIT: ${{ github.sha }}
          PULL_REQUEST: "false"
          GITHUB_EVENT_NAME: ${{ github.event_name }}

      - name: Check Keystore Availability
        id: check_keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE }}" ]; then
            echo "has_keystore=true" >> $GITHUB_OUTPUT
          else
            echo "has_keystore=false" >> $GITHUB_OUTPUT
          fi

      - name: Sign APK
        if: steps.check_keystore.outputs.has_keystore == 'true'
        uses: ilharp/sign-android-release@v2.0.0
        with:
          releaseDir: app/build/outputs/apk/release/
          signingKey: ${{ secrets.KEYSTORE }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: 36.0.0

      - name: Move and prepare Release APK
        run: |
          OUTPUT_DIR="app/build/outputs/apk/release"
          mkdir -p "$OUTPUT_DIR/out"
          SIGNED_APK=$(find "$OUTPUT_DIR" -name "*-signed.apk" -o -name "*-unsigned-signed.apk" 2>/dev/null | head -1 || true)
          if [ -n "$SIGNED_APK" ] && [ -f "$SIGNED_APK" ]; then
            cp "$SIGNED_APK" "$OUTPUT_DIR/out/unhinge-release.apk"
          else
            RELEASE_APK=$(find "$OUTPUT_DIR" -name "*.apk" | head -1)
            cp "$RELEASE_APK" "$OUTPUT_DIR/out/unhinge-release.apk"
          fi

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: unhinge-release
          path: app/build/outputs/apk/release/out/*

  build_debug:
    name: Build Debug APK
    if: github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_KEY }}
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore Persistent Keystore
        env:
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
        if: env.DEBUG_KEYSTORE != ''
        run: |
          echo "$DEBUG_KEYSTORE" | base64 -d > ./app/persistent-debug.keystore

      - name: Build Debug APK
        run: ./gradlew --console=plain assembleDebug --warning-mode summary
        env:
          BUILD_COMMIT: ${{ github.sha }}
          PULL_REQUEST: "false"
          GITHUB_EVENT_NAME: ${{ github.event_name }}

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: unhinge-debug
          path: app/build/outputs/apk/debug/*.apk

  publish_nightly:
    name: Publish Nightly Release
    if: github.event_name == 'push'
    needs: [build_release, build_debug]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download Release APK
        uses: actions/download-artifact@v8
        with:
          name: unhinge-release
          path: nightly

      - name: Publish Nightly Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mv nightly/unhinge-release.apk nightly/Unhinge-Nightly.apk

          PREVIOUS_NIGHTLY_SHA=$(gh release view nightly --json targetCommitish --jq .targetCommitish 2>/dev/null || true)
          {
            echo "Automated prerelease built from main at commit $GITHUB_SHA. It may be unstable."
            if [ -n "$PREVIOUS_NIGHTLY_SHA" ] && [ "$PREVIOUS_NIGHTLY_SHA" != "$GITHUB_SHA" ]; then
              echo
              echo "## Changes since previous nightly"
              gh api "repos/$GITHUB_REPOSITORY/compare/$PREVIOUS_NIGHTLY_SHA...$GITHUB_SHA" \
                --jq '.commits[] | "* \(.commit.message | split("\n")[0]) (\(.sha[0:7]))"' || true
            fi
          } > nightly-notes.md

          if gh release view nightly > /dev/null 2>&1; then
            gh release delete nightly --yes --cleanup-tag
          elif gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/nightly" > /dev/null 2>&1; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/nightly" > /dev/null 2>&1 || true
          fi

          gh release create nightly \
            nightly/Unhinge-Nightly.apk \
            --target "$GITHUB_SHA" \
            --title "Unhinge Nightly" \
            --notes-file nightly-notes.md \
            --generate-notes \
            --prerelease \
            --latest=false

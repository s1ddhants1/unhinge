name: Build PR

on:
  pull_request:
    branches:
      - "**"
    paths-ignore:
      - "README.md"
      - "assets/**"
      - ".github/**/*.md"
      - ".github/FUNDING.yml"
      - ".github/ISSUE_TEMPLATE/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build PR Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore PR debug keystore
        id: pr_keystore
        uses: actions/cache/restore@v6
        with:
          path: app/pr-debug.keystore
          key: pr-debug-keystore-${{ github.event.number }}

      - name: Generate PR debug keystore if not cached
        if: steps.pr_keystore.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair -v \
            -keystore app/pr-debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Unhinge PR ${{ github.event.number }},O=Unhinge,C=US"

      - name: Save PR debug keystore
        if: steps.pr_keystore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: app/pr-debug.keystore
          key: ${{ steps.pr_keystore.outputs.cache-primary-key }}

      - name: Build Debug APK
        run: ./gradlew --console=plain assembleDebug --warning-mode summary
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST: "true"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: app-universal-debug-pr-${{ github.event.number }}
          path: app/build/outputs/apk/debug/*.apk

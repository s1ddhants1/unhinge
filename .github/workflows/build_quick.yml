name: Quick Test Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_quick:
    name: Quick Universal Release Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_KEY }}
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK (No Lint)
        run: ./gradlew --console=plain assembleRelease --warning-mode summary -x lint
        env:
          PULL_REQUEST: "false"
          GITHUB_EVENT_NAME: ${{ github.event_name }}

      - name: Check Keystore Availability
        id: check_keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE }}" ]; then
            echo "has_keystore=true" >> $GITHUB_OUTPUT
          else
            echo "has_keystore=false" >> $GITHUB_OUTPUT
          fi

      - name: Sign APK
        if: steps.check_keystore.outputs.has_keystore == 'true'
        uses: ilharp/sign-android-release@v2.0.0
        with:
          releaseDir: app/build/outputs/apk/release/
          signingKey: ${{ secrets.KEYSTORE }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: 36.0.0

      - name: Move signed APK
        run: |
          OUTPUT_DIR="app/build/outputs/apk/release"
          mkdir -p "$OUTPUT_DIR/out"
          SIGNED_APK=$(find "$OUTPUT_DIR" -name "*-signed.apk" -o -name "*-unsigned-signed.apk" 2>/dev/null | head -1 || true)
          if [ -n "$SIGNED_APK" ] && [ -f "$SIGNED_APK" ]; then
            cp "$SIGNED_APK" "$OUTPUT_DIR/out/unhinge-quick-release.apk"
          else
            RELEASE_APK=$(find "$OUTPUT_DIR" -name "*.apk" | head -1)
            cp "$RELEASE_APK" "$OUTPUT_DIR/out/unhinge-quick-release.apk"
          fi

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: unhinge-quick-release
          path: app/build/outputs/apk/release/out/*

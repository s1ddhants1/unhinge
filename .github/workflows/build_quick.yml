name: Quick Test Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_quick:
    name: Quick Universal Release Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_KEY }}
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK (No Lint)
        run: ./gradlew --console=plain assembleRelease --warning-mode summary -x lint
        env:
          PULL_REQUEST: "false"
          GITHUB_EVENT_NAME: ${{ github.event_name }}

      - name: Check Keystore Availability
        id: check_keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE }}" ]; then
            echo "has_keystore=true" >> $GITHUB_OUTPUT
          else
            echo "has_keystore=false" >> $GITHUB_OUTPUT
          fi

      - name: Sign APK (Custom Keystore)
        if: steps.check_keystore.outputs.has_keystore == 'true'
        uses: ilharp/sign-android-release@v2.0.0
        with:
          releaseDir: app/build/outputs/apk/release/
          signingKey: ${{ secrets.KEYSTORE }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: 36.0.0

      - name: Restore Fallback Keystore
        if: steps.check_keystore.outputs.has_keystore != 'true'
        id: fallback_keystore_cache
        uses: actions/cache/restore@v6
        with:
          path: app/build/keystore/quick-fallback.keystore
          key: unhinge-quick-fallback-keystore

      - name: Generate Fallback Keystore if not cached
        if: steps.check_keystore.outputs.has_keystore != 'true' && steps.fallback_keystore_cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p app/build/keystore
          keytool -genkeypair -v \
            -keystore app/build/keystore/quick-fallback.keystore \
            -storepass android \
            -alias unhingequick \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Unhinge Quick,O=Unhinge,C=US"

      - name: Save Fallback Keystore to cache
        if: steps.check_keystore.outputs.has_keystore != 'true' && steps.fallback_keystore_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: app/build/keystore/quick-fallback.keystore
          key: unhinge-quick-fallback-keystore

      - name: Prepare Fallback Keystore Base64
        if: steps.check_keystore.outputs.has_keystore != 'true'
        run: |
          FALLBACK_B64=$(base64 -w 0 app/build/keystore/quick-fallback.keystore)
          echo "FALLBACK_KEYSTORE_B64=$FALLBACK_B64" >> $GITHUB_ENV

      - name: Sign APK (Fallback Keystore)
        if: steps.check_keystore.outputs.has_keystore != 'true'
        uses: ilharp/sign-android-release@v2.0.0
        with:
          releaseDir: app/build/outputs/apk/release/
          signingKey: ${{ env.FALLBACK_KEYSTORE_B64 }}
          keyAlias: unhingequick
          keyStorePassword: android
          keyPassword: android
          buildToolsVersion: 36.0.0

      - name: Move signed APK
        run: |
          OUTPUT_DIR="app/build/outputs/apk/release"
          mkdir -p "$OUTPUT_DIR/out"
          SIGNED_APK=$(find "$OUTPUT_DIR" -name "*-signed.apk" -o -name "*-unsigned-signed.apk" 2>/dev/null | head -1 || true)
          if [ -n "$SIGNED_APK" ] && [ -f "$SIGNED_APK" ]; then
            cp "$SIGNED_APK" "$OUTPUT_DIR/out/unhinge-quick-release.apk"
          else
            echo "::error::Signed APK not found in $OUTPUT_DIR!"
            exit 1
          fi

      - name: Verify APK Signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          echo "Verifying APK signature using $APKSIGNER"
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/out/unhinge-quick-release.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: unhinge-quick-release
          path: app/build/outputs/apk/release/out/*
